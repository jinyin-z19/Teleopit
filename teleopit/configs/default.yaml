defaults:
  - robot: g1
  - controller: rl_policy
  - input: bvh
  - _self_

policy_hz: 50.0
pd_hz: 200.0
transition_duration: 2.0  # seconds to interpolate from default pose to motion command (0.0 to disable)
velcmd_fixed_ref_yaw_alignment: true  # apply one fixed startup yaw offset to VelCmd reference motion
viewers: "sim2sim"
realtime: false
debug_trace_path: null
playback:
  pause_on_end: false
  keyboard:
    enabled: false

# ── Terrain height observation (propagated to controller config) ───
# Set num_height_points > 0 and enable robot.terrain_height_scanner to
# include terrain height features in the observation vector.
# num_height_points: 25  # e.g. for 5×5 probe grid

hydra:
  run:
    dir: .
